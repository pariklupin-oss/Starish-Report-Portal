<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayIST=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date());
const nowHM=()=>new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
const fmt=m=>{m=Math.max(0,Math.round(Number(m)||0));return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';};
const mins=(a,b)=>{if(!/^\d{2}:\d{2}$/.test(a||'')||!/^\d{2}:\d{2}$/.test(b||''))return 0;const x=a.split(':').map(Number),y=b.split(':').map(Number);let d=(y[0]*60+y[1])-(x[0]*60+x[1]);if(d<=0)d+=1440;return d;};
let token='';try{token=localStorage.getItem('starish-session')||sessionStorage.getItem('starish-session')||'';}catch{}
function saveToken(v){token=v;try{localStorage.setItem('starish-session',v);}catch{try{sessionStorage.setItem('starish-session',v);}catch{}}}
function clearToken(){token='';try{localStorage.removeItem('starish-session');}catch{}try{sessionStorage.removeItem('starish-session');}catch{}}
let toastT;function toast(s){const t=$('#toast');t.textContent=s;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4500);}
function api(action,data={}){const url=window.PORTAL_CONFIG?.apiUrl;
 if(!/^https:\/\/script\.google\.com\/macros\/s\/[a-zA-Z0-9_-]+\/exec$/.test(url||''))return Promise.reject(Error('Portal server URL is not set.'));
 if(!navigator.onLine)return Promise.reject(Error('Internet is required to read or save data.'));
 const nonce=Array.from(crypto.getRandomValues(new Uint8Array(24)),v=>v.toString(16).padStart(2,'0')).join(''),requestId=(crypto.randomUUID?crypto.randomUUID():nonce);
 return new Promise((resolve,reject)=>{const frame=document.createElement('iframe'),form=document.createElement('form'),input=document.createElement('input');frame.name='api_'+nonce;frame.hidden=true;form.hidden=true;form.method='POST';form.action=url;form.target=frame.name;input.type='hidden';input.name='payload';input.value=JSON.stringify({action,data,token,nonce,requestId,origin:location.origin});form.append(input);
  const timeout=setTimeout(()=>finish(Error('The server is taking too long. Check your internet and try again.')),90000);
  function receive(e){let host;try{const u=new URL(e.origin);if(u.protocol!=='https:')return;host=u.hostname;}catch{return;}
   if(!(host==='script.google.com'||host==='script.googleusercontent.com'||host.endsWith('.googleusercontent.com')))return;
   if(e.data?.channel!=='starish-api'||e.data.nonce!==nonce)return;
   if(e.data.result?.ok)finish(null,e.data.result);else finish(Error(e.data.result?.error||'Request failed'));}
  function finish(err,res){clearTimeout(timeout);window.removeEventListener('message',receive);form.remove();frame.remove();err?reject(err):resolve(res);}
  window.addEventListener('message',receive);document.body.append(frame,form);form.submit();});}


const S={data:null,f:'open',q:'',days:30};
const OPEN=['Pending Manager Review','In Progress'];
const cls=s=>s==='Resolved'?'res':s==='Forwarded to Maintenance'?'fwd':OPEN.includes(s)?'pen':'oth';
const when=t=>{try{return new Date(t).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}catch{return '';}};
function showLogin(){$('#boot').hidden=true;$('#app').hidden=true;$('#addBtn').hidden=true;$('#logout').hidden=true;$('#login').hidden=false;$('#who').textContent='Starish Autopac Pvt. Ltd.';}
function saveCache(){try{localStorage.setItem('q-cache',JSON.stringify({days:S.days,data:S.data}));}catch{}}
function showApp(){$('#boot').hidden=true;$('#login').hidden=true;$('#app').hidden=false;$('#logout').hidden=false;$('#addBtn').hidden=false;const m=S.data.me;$('#who').textContent=m.name+(S.data.manager?' · Quality Manager':m.department?' · '+m.department:'');render();}
let loadSeq=0;
async function load(){if(!token)return showLogin();const seq=++loadSeq;$('#sync').hidden=!S.data;
 try{const data=await api('qualityData',{days:S.days});if(seq!==loadSeq)return;S.data=data;saveCache();showApp();}
 catch(e){if(seq!==loadSeq)return;if(/Login expired|Account inactive|login|sign in|session/i.test(e.message)){clearToken();try{localStorage.removeItem('q-cache');}catch{}S.data=null;showLogin();toast(e.message);}else if(S.data){toast('Could not refresh: '+e.message);}else{$('#boot').hidden=true;$('#app').hidden=false;$('#list').innerHTML='<div class="err">'+esc(e.message)+'</div>';}}
 finally{if(seq===loadSeq)$('#sync').hidden=true;}}
/* save with automatic retry when the server is busy */
async function send(action,data,btn,label){const old=btn?btn.textContent:'';if(btn){btn.disabled=true;btn.textContent='Saving…';}
 try{for(let i=1;;i++){try{return await api(action,data);}catch(e){if(/busy|too long/i.test(e.message)&&i<4){if(btn)btn.textContent='Server busy, retrying ('+i+')…';await new Promise(r=>setTimeout(r,2000*i));continue;}throw e;}}}
 finally{if(btn){btn.disabled=false;btn.textContent=old;}}}
function render(){const d=S.data,me=d.me.email,ql=S.q.trim().toLowerCase();
 const all=(d.issues||[]).filter(x=>!x.deletedAt);
 if(d.manager){const inR=all.filter(x=>String(x.createdDate||x.createdAt||'').slice(0,10)>=d.from);$('#kpis').innerHTML=`<div class="stats"><div><b>${inR.length}</b><small>Records</small></div><div><b>${all.filter(x=>OPEN.includes(x.status)).length}</b><small>To review</small></div><div><b>${inR.filter(x=>x.status==='Resolved').length}</b><small>Resolved</small></div><div><b>${inR.filter(x=>x.status==='Forwarded to Maintenance').length}</b><small>To Maint.</small></div></div>`;}else $('#kpis').innerHTML='';
 const rows=all.filter(x=>(S.f==='all'||OPEN.includes(x.status))&&(!ql||[x.tokenNo,x.jobCardNumber,x.customerName,x.productName,x.description,x.reportedBy,x.status].join(' ').toLowerCase().includes(ql)));
 $('#list').innerHTML=rows.map(x=>{const own=x.reporterId===me,pen=x.status==='Pending Manager Review';
  const acts=[];if(pen&&(d.manager||own))acts.push(`<button type="button" class="secondary" data-ed="${esc(x.id)}">Edit</button>`);
  if(d.manager&&OPEN.includes(x.status)){acts.push(`<button type="button" class="go" data-rs="${esc(x.id)}">Resolve</button>`);acts.push(`<button type="button" class="upd" data-fw="${esc(x.id)}">To Maintenance</button>`);}
  if(d.mediaOn&&x.status!=='Resolved'&&(d.manager||own))acts.push(`<button type="button" class="secondary" data-md="${esc(x.id)}">📷 Photo</button>`);
  if(d.manager||(pen&&own))acts.push(`<button type="button" class="danger" data-dl="${esc(x.id)}">Delete</button>`);
  return `<div class="card qcard ${cls(x.status)}"><div class="qtop"><div><span class="tokn">${esc(x.tokenNo)}</span><div class="meta" style="margin:0">${esc(when(x.createdAt))}</div></div><span class="badge ${cls(x.status)}">${esc(x.status)}</span></div>
  <div class="qh">JC ${esc(x.jobCardNumber)} · ${esc(x.productName)}</div><div class="qc">${esc(x.customerName)}</div><div class="desc">${esc(x.description)}</div>${typeof cmThumbs==='function'?cmThumbs(x.media):''}
  <div class="kv"><span><small>Reported by</small>${esc(x.reportedBy||'')}</span><span><small>Classification</small>${esc(x.category||'Awaiting review')}</span>${x.maintenanceToken?`<span><small>Maintenance token</small>${esc(x.maintenanceToken)}</span>`:''}</div>
  ${x.solutionNote?`<div class="note"><b>${x.status==='Resolved'?'Quality solution':'Manager note'}:</b> ${esc(x.solutionNote)}</div>`:''}
  ${acts.length?`<div class="btnrow">${acts.join('')}</div>`:''}</div>`;}).join('')||`<div class="card empty">${S.f==='open'?'No open Quality entries.':'No Quality entries in this period.'}<br><small>Tap <b>+ Register Quality</b> to add one.</small></div>`;
 const find=id=>all.find(x=>x.id===id);
 document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>issueForm(find(b.dataset.ed)));
 document.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{if(typeof cmAddSheet!=='function')return toast('Please refresh the app');cmAddSheet('Photo / video of the defect',{api,kind:'quality',ref:b.dataset.md,onDone:load});});
 document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>resolveForm(find(b.dataset.rs)));
 document.querySelectorAll('[data-fw]').forEach(b=>b.onclick=()=>forwardForm(find(b.dataset.fw)));
 document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{const x=find(b.dataset.dl);if(!x||!confirm('Delete Quality record '+x.tokenNo+'?'))return;try{await send('deleteQualityIssue',{id:x.id,version:x.version},b);toast('Quality entry deleted');load();}catch(e){toast(e.message);}});}
function closeSheet(){const sh=$('#sheet');sh.hidden=true;sh.innerHTML='';document.body.style.overflow='';}
function openSheet(title,body){const sh=$('#sheet');sh.hidden=false;document.body.style.overflow='hidden';sh.innerHTML=`<header><button type="button" id="closeSheet">✕</button><div class="t"><b>${esc(title)}</b></div></header><main>${body}</main>`;$('#closeSheet').onclick=closeSheet;return sh;}
function issueForm(ex){const d=S.data,jobs=[...(d.jobs||[])];let sel=null;
 if(ex){sel=jobs.find(j=>j.jobCardNumber===ex.jobCardNumber&&j.customerName===ex.customerName&&j.productName===ex.productName)||{jobCardNumber:ex.jobCardNumber,customerName:ex.customerName,productName:ex.productName,date:''};if(!jobs.includes(sel))jobs.unshift(sel);}
 openSheet(ex?'Edit '+(ex.tokenNo||'Quality entry'):'Register Quality',`<div class="card"><label style="margin-top:0">Job Card (search number, customer or item)</label><input id="js" type="search" autocomplete="off" placeholder="Type Job Card number…"><div class="jobs" id="jl"></div><div id="selBox"></div>
 <label>Quality Details / Remarks</label><textarea id="desc" maxlength="3000" placeholder="Glue, size, print, material or other defect">${esc(ex?ex.description:'')}</textarea>
 ${jobs.length?'':`<div class="err">No Job Card found in the last 7 days of Production Planning.${d.jobsError?' ('+esc(d.jobsError)+')':''}</div>`}
 <button type="button" class="save" id="sv">${ex?'Save correction':'Save Quality entry'}</button><p class="muted">Job Cards from today and the previous 6 days are listed. The entry goes to the Quality Manager for review.</p></div>`);
 const drawSel=()=>{$('#selBox').innerHTML=sel?`<div class="sel"><b>Job Card ${esc(sel.jobCardNumber)}</b><div>${esc(sel.customerName)}</div><div class="muted">${esc(sel.productName)}${sel.date?' · '+esc(sel.date):''}</div></div>`:'';};
 const draw=()=>{const q=$('#js').value.trim().toLowerCase(),num=/^\d+$/.test(q);const L=jobs.filter(j=>!q||(num?String(j.jobCardNumber).toLowerCase().startsWith(q):[j.jobCardNumber,j.customerName,j.productName].join(' ').toLowerCase().includes(q))).slice(0,60);
  $('#jl').innerHTML=L.map(j=>`<button type="button" data-j="${jobs.indexOf(j)}" class="${j===sel?'on':''}"><b>JC ${esc(j.jobCardNumber)}</b> · ${esc(j.customerName)}<small>${esc(j.productName)}${j.date?' · '+esc(j.date):''}</small></button>`).join('')||'<div class="empty">No matching Job Card in the last 7 days.</div>';
  document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{sel=jobs[Number(b.dataset.j)];drawSel();draw();$('#desc').focus();});};
 $('#js').oninput=draw;draw();drawSel();
 $('#sv').onclick=async e=>{if(!sel)return toast('Select a Job Card from the list.');const desc=$('#desc').value.trim();if(!desc)return toast('Enter Quality details.');
  const data={jobCardNumber:sel.jobCardNumber,customerName:sel.customerName,productName:sel.productName,description:desc};
  try{const r=ex?await send('editQualityIssue',{id:ex.id,version:ex.version,...data},e.target):await send('saveQualityIssue',data,e.target);closeSheet();toast(r.warning||(ex?'Quality entry corrected':'Saved · '+((r.issue&&r.issue.tokenNo)||'sent to Quality Manager')));load();if(!ex&&r.issue&&r.issue.id&&S.data&&S.data.mediaOn&&typeof cmAddSheet==='function'&&confirm('Add a photo/video of the defect now?'))cmAddSheet('Photo / video of the defect',{api,kind:'quality',ref:r.issue.id,onDone:load});}catch(x){toast(x.message);}};}
function resolveForm(x){openSheet('Resolve '+x.tokenNo,`<div class="card"><div class="qh" style="margin-top:0">JC ${esc(x.jobCardNumber)} · ${esc(x.productName)}</div><div class="qc">${esc(x.customerName)}</div><div class="desc">${esc(x.description)}</div><label>Solution / Resolution note</label><textarea id="sn" maxlength="3000" placeholder="Cause checked and action taken"></textarea><button type="button" class="save go" id="sv">Save solution and resolve</button></div>`);
 $('#sv').onclick=async e=>{const n=$('#sn').value.trim();if(!n)return toast('Enter the solution note.');try{await send('resolveQualityIssue',{id:x.id,version:x.version,solutionNote:n},e.target);closeSheet();toast('Quality issue resolved');load();}catch(err){toast(err.message);}};}
function forwardForm(x){openSheet('Forward '+x.tokenNo+' to Maintenance',`<div class="card"><div class="qh" style="margin-top:0">JC ${esc(x.jobCardNumber)} · ${esc(x.productName)}</div><div class="desc">${esc(x.description)}</div>
 <label>Machine name</label><input id="fm" maxlength="150"><label>Machine unit / part</label><input id="fu" maxlength="150"><div class="row"><div><label>Issue type</label><select id="ft"><option>Mechanical</option><option>Electrical</option><option>Other</option></select></div><div><label>Priority</label><select id="fp"><option>Normal</option><option>Urgent</option></select></div></div>
 <label>Quality Manager note</label><textarea id="fn" maxlength="1500" placeholder="Optional note for Maintenance"></textarea><button type="button" class="save upd" id="sv">Create Maintenance complaint</button><p class="muted">This creates an Open complaint in the Maintenance register.</p></div>`);
 $('#sv').onclick=async e=>{const m=$('#fm').value.trim();if(!m)return toast('Enter machine name.');try{const r=await send('forwardQualityIssue',{id:x.id,version:x.version,machine:m,unit:$('#fu').value.trim(),issueType:$('#ft').value,priority:$('#fp').value,managerNote:$('#fn').value.trim()},e.target);closeSheet();toast('Forwarded as Maintenance '+(r.maintenanceToken||''));load();}catch(err){toast(err.message);}};}
$('#addBtn').onclick=()=>{if(S.data)issueForm(null);};
$('#q').oninput=e=>{S.q=e.target.value;if(S.data)render();};
$('#days').onchange=e=>{S.days=Number(e.target.value)||30;load();};
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{S.f=b.dataset.f;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));if(S.data)render();});
$('#pinMode').onclick=()=>{$('#pinMode').classList.add('on');$('#emailMode').classList.remove('on');$('#pinForm').hidden=false;$('#emailPanel').hidden=true;};
$('#emailMode').onclick=()=>{$('#emailMode').classList.add('on');$('#pinMode').classList.remove('on');$('#pinForm').hidden=true;$('#emailPanel').hidden=false;};
$('#pinForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const r=await api('loginPin',{phone:$('#phone').value,pin:$('#pin').value});saveToken(r.token);$('#pin').value='';await load();}catch(x){toast(x.message);}finally{b.disabled=false;}};
$('#otpReq').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const r=await api('loginRequest',{email:$('#email').value});$('#otpVerify').hidden=false;toast(r.message||'Code sent');}catch(x){toast(x.message);}finally{b.disabled=false;}};
$('#otpVerify').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const r=await api('loginVerify',{email:$('#email').value,code:$('#code').value});saveToken(r.token);$('#code').value='';await load();}catch(x){toast(x.message);}finally{b.disabled=false;}};
$('#logout').onclick=async()=>{if(!confirm('Sign out?'))return;try{await api('logout');}catch{}clearToken();S.data=null;showLogin();};
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
let installEvt=null;const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(!standalone)$('#install').hidden=false;});
addEventListener('appinstalled',()=>{$('#install').hidden=true;toast('App installed. Open it from your home screen.');});
$('#install').onclick=async()=>{if(installEvt){installEvt.prompt();await installEvt.userChoice.catch(()=>{});installEvt=null;$('#install').hidden=true;}};
if(!standalone&&/iphone|ipad|ipod/i.test(navigator.userAgent)){let seen='';try{seen=localStorage.getItem('q-ios-tip')||'';}catch{}if(!seen)$('#iosTip').hidden=false;}
$('#iosClose').onclick=()=>{$('#iosTip').hidden=true;try{localStorage.setItem('q-ios-tip','1');}catch{}};


try{const c=JSON.parse(localStorage.getItem('q-cache')||'null');if(token&&c&&c.data&&c.data.me){S.data=c.data;S.days=c.days||30;$('#days').value=String(S.days);showApp();}}catch{}
load();
</script>
</body></html>
